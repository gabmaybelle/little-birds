// Loader-neutral code. This project is compiled on its own so a Fabric or NeoForge import can't
// sneak in: only Minecraft and the JDK are on the classpath. Nothing here ships as a jar;
// `fabric` and `neoforge` compile these sources into theirs.
plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// Only for the launch-side classes Loom needs. No Fabric API here.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

loom {
	mods {
		"little_birds" {
			sourceSet sourceSets.main
		}
	}
}
