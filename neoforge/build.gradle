plugins {
	id 'net.neoforged.moddev' version "${moddev_version}"
}

// The common sources and assets are compiled straight into this jar, the same as the Fabric side.
sourceSets.main {
	java.srcDir project(':common').file('src/main/java')
	resources.srcDir project(':common').file('src/main/resources')
}

// The game tests (src/gametest) are a mod of their own, loaded only by runGameTestServer below;
// nothing in them ships in the jar.
sourceSets {
	gametest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = project.neoforge_version
	addModdingDependenciesTo(sourceSets.gametest)

	mods {
		"little_birds" {
			sourceSet sourceSets.main
		}
		"little_birds_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
			loadedMods = [mods.little_birds]
		}
		server {
			server()
			programArgument '--nogui'
			loadedMods = [mods.little_birds]
		}
		// Server game tests: `./gradlew :neoforge:runGameTestServer` starts vanilla's test server
		// (a flat world, no window) and runs the checks in src/gametest. It exits non-zero if one fails.
		//   -PcompatMods=<folder>  also load every jar in that folder (tools/fetch-test-mods.js)
		//   -PexpectMods=<ids>     comma-separated mod ids that must be loaded, so a run whose compat
		//                          jars didn't load fails instead of passing without them
		gameTestServer {
			type = 'gameTestServer'
			loadedMods = [mods.little_birds, mods.little_birds_gametest]
			programArguments.addAll('--tests', 'little_birds_gametest:*')
			systemProperty 'little_birds.expectMods', project.findProperty('expectMods') ?: ''
		}
	}
}

// `-PcompatMods=<folder>`: the compat mods' jars (and their libraries) join the game test's run.
if (project.hasProperty('compatMods')) {
	dependencies {
		runtimeOnly fileTree(project.compatMods) { include '*.jar' }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version
	// The mod icon (art/icon.png); the jar carries it as icon.png.
	from(rootProject.file('art/icon.png'))

	filesMatching("META-INF/neoforge.mods.toml") {
		expand "version": version
	}
}

// little-birds-neoforge-<version>.jar, the name players download.
tasks.named('jar') { archiveBaseName = "${rootProject.name}-neoforge" }
tasks.named('sourcesJar') { archiveBaseName = "${rootProject.name}-neoforge" }
