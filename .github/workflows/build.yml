# Builds Little Birds on every push and pull request, then tests what it built:
# - build: the Fabric and NeoForge jars, attached to the run as "Downloads".
# - game: the in-game test (fabric/src/gametest) in a real game, alone and alongside the mods a
#   cozy-pack player is likely to run with it (tools/fetch-test-mods.js).
# - game (NeoForge): vanilla's test server runs the NeoForge jar's own checks (neoforge/src/gametest),
#   alone and with the compat mods. No window needed.

name: build
on:
  push:
    paths-ignore:
      - '**.md'
      - 'art/**'
      - 'LICENSE'
  pull_request:

# A newer push to the same branch stops the run it replaces.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    # A pull request from a branch in this repo is already built by its push; only build forks' twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: the mods
        run: |
          chmod +x ./gradlew
          ./gradlew build
          mkdir -p dist
          cp fabric/build/libs/little-birds-fabric-*.jar neoforge/build/libs/little-birds-neoforge-*.jar dist/
          rm -f dist/*-sources.jar
          ls dist/
      - name: capture the downloads
        uses: actions/upload-artifact@v7
        with:
          name: Downloads
          path: dist/

  game:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compat: none, name: 'alone' }
          - { compat: fabric, name: 'with Vibrant Parrots, Cozy Core and Cosy Critters' }
    name: game (${{ matrix.name }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: the compat mods
        if: matrix.compat != 'none'
        run: node tools/fetch-test-mods.js fabric ~/compat && ls ~/compat/mods
      - name: install EGL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libegl-mesa0
      - name: game test
        # 26.3 asks for an sRGB-capable window, which Xvfb's GLX can't give, so the game would hang
        # at startup. Mesa's EGL can; SDL uses it with this set.
        env:
          SDL_VIDEO_FORCE_EGL: '1'
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          args=""
          if [ "${{ matrix.compat }}" != none ]; then
            args="-PcompatMods=$HOME/compat/mods -PexpectMods=$(node tools/fetch-test-mods.js fabric --ids)"
          fi
          xvfb-run -a ./gradlew :fabric:runClientGameTest $args
      - name: capture the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Game test screenshots (${{ matrix.name }})
          path: fabric/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore

  game-neoforge:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { compat: none, name: 'alone' }
          - { compat: neoforge, name: 'with Vibrant Parrots and Cozy Core' }
    name: game (NeoForge, ${{ matrix.name }})
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with caching)
        uses: gradle/actions/setup-gradle@v6
      - name: the compat mods
        if: matrix.compat != 'none'
        run: node tools/fetch-test-mods.js neoforge ~/compat && ls ~/compat/mods
      - name: game test
        # A dedicated test server: no window, so no virtual display needed.
        timeout-minutes: 20
        run: |
          chmod +x ./gradlew
          args=""
          if [ "${{ matrix.compat }}" != none ]; then
            args="-PcompatMods=$HOME/compat/mods -PexpectMods=$(node tools/fetch-test-mods.js neoforge --ids)"
          fi
          ./gradlew :neoforge:runGameTestServer $args
